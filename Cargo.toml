[package]
name = "painty"
version = "0.3.4"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }
egui_commonmark = { version = "0.18", default-features = false, features = ["pulldown_cmark"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# Rounded corners of the opaque window, asked from Windows (DWM).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
winres = "0.1"

# Smaller, faster executable (and a faster self-update download).
# `panic = "abort"` is deliberately not set: the updater relies on a panicking
# worker thread being detected instead of closing the whole app.
[profile.release]
lto = true
codegen-units = 1
strip = true