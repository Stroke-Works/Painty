[package]
name = "painty"
version = "0.2.3"
license = "MIT"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

[build-dependencies]
winres = "0.1"

# Smaller, faster executable (and a faster self-update download).
# `panic = "abort"` is deliberately not set: the updater relies on a panicking
# worker thread being detected instead of closing the whole app.
[profile.release]
lto = true
codegen-units = 1
strip = true
