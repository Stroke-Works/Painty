name: Release

# Publishes a release when a version tag is pushed (git tag vx.x.x && git push origin vx.x.x).
# The tag must match the version in Cargo.toml.
# Stable tags (vX.Y.Z) become the latest release. Pre-release tags (vX.Y.Z-beta.N)
# are published as "Pre-release" and never replace the latest stable download.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check the tag and detect the channel
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          # A semver pre-release tag contains a hyphen (v0.3.2-beta.1).
          if ($version -match '-') {
            "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MAKE_LATEST=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MAKE_LATEST=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Checksum for the updater
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item target\release\painty.exe dist\painty.exe
          $hash = (Get-FileHash dist\painty.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  painty.exe" | Set-Content -Path dist\painty.exe.sha256 -Encoding ascii

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" painty.iss

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Painty ${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.MAKE_LATEST }}
          overwrite_files: true
          files: |
            dist/painty.exe
            dist/painty.exe.sha256
            dist/PaintySetup-*.exe
